[package]
name = "soundboarrrrrrrrrd"
version = "0.1.0"
description = "Soundboard qui envoie des sons dans le micro"
authors = ["Timothee754"]
edition = "2024"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (cargo#8519).
name = "soundboarrrrrrrrrd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls plutôt qu'OpenSSL : rien à installer sur Windows et macOS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
