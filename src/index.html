<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soundboarrrrrrrrrd</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header id="entete">
      <nav id="onglets" aria-label="Onglets">
        <button data-onglet="favoris">⭐ Favoris</button>
        <button data-onglet="chercher">🔍 Chercher</button>
      </nav>
      <form id="recherche" hidden>
        <input id="mot" type="search" placeholder="Chercher un son sur myinstants…" aria-label="Chercher un son" />
      </form>
    </header>
    <p id="etat" role="status"></p>
    <section id="favoris">
      <p id="favoris-vide" hidden>
        Aucun favori pour l'instant. Va dans <strong>🔍 Chercher</strong> et clique sur <strong>＋</strong> sur un son.
      </p>
      <ul id="grille" class="boites"></ul>
    </section>
    <section id="chercher" hidden>
      <ul id="resultats" class="boites"></ul>
    </section>
  </body>
</html>
